# A generic, single-database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path pathsprepended to sys.path; common use is to set to '.'
# to detect the path of the parent directory of the 'alembic' directory
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# version path separator; as of Alembic 1.11.0, this defaults to 'os',
# which uses os.pathsep (e.g. ';' on Windows, ':' on Unix)
version_path_separator = os


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
